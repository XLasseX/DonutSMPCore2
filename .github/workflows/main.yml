name: Build DonutSMPCore

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract source
        run: |
          unzip -o DonutSMPCore-1.1.0-source.zip

      - name: Build plugin
        run: |
          cd DonutSMPCore-1.1.0
          mvn clean package -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutSMPCore-1.1.0
          path: DonutSMPCore-1.1.0/target/*.jar
